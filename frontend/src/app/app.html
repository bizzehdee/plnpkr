<nav class="navbar navbar-expand bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand mb-0 h1" routerLink="/">{{ 'app.brand' | t }}</a>
    <div class="d-flex align-items-center gap-2">
      <!--
        Tool switcher (#20): the platform hosts two tools, so the shell offers a way back to the
        front door from inside either one. Hidden on the picker itself, where it would point at
        the current page.
      -->
      @if (showToolSwitcher()) {
        <a class="btn btn-sm btn-outline-secondary" routerLink="/">{{ 'platform.allTools' | t }}</a>
      }
      <span id="connection-status" class="badge {{ statusClass() }}">{{ statusLabel() }}</span>
      <select
        class="form-select form-select-sm w-auto"
        [(ngModel)]="locale"
        [attr.aria-label]="'app.language' | t"
      >
        @for (l of locales; track l.id) {
          <option [ngValue]="l.id">{{ l.label }}</option>
        }
      </select>
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary"
        (click)="cycleTheme()"
        [title]="'Theme: ' + themePreference() + ' (click to change)'"
        [attr.aria-label]="'app.toggleTheme' | t"
      >
        {{ themeIcon() }}
      </button>
    </div>
  </div>
</nav>

<router-outlet />

<footer class="border-top mt-auto py-3">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2 small text-body-secondary">
    <span>{{ 'app.copyright' | t }}
      <a href="https://www.darrenhorrocks.co.uk" target="_blank" rel="noopener">Darren Horrocks</a>
    </span>
    <span class="d-flex gap-3">
      <a href="https://ko-fi.com/bizzehdee" target="_blank" rel="noopener">{{ 'app.support' | t }}</a>
      <a href="https://github.com/bizzehdee/plnpkr" target="_blank" rel="noopener">{{ 'app.github' | t }}</a>
    </span>
  </div>
</footer>
